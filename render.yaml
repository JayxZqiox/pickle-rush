# Render Blueprint: New -> Blueprint -> pick this repo. Region is Singapore (closest to the Philippines).
# Render will ask for the two Upstash values; they keep accounts safe when the free server sleeps.
services:
  - type: web
    name: pickle-rush
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
